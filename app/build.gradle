plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.baixafacil'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.baixafacil'
        minSdk 29
        targetSdk 34
        versionCode 32
        versionName '0.1.0-alpha.32'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Usado somente quando os 4 Secrets estão disponíveis no GitHub Actions.
    // Nenhuma senha ou chave é gravada no repositório.
    def signingFilePath = System.getenv('KEYSTORE_FILE')
    def signingStorePassword = System.getenv('KEYSTORE_PASSWORD')
    def signingAlias = System.getenv('KEY_ALIAS')
    def signingKeyPassword = System.getenv('KEY_PASSWORD')
    def hasReleaseSigning = signingFilePath && file(signingFilePath).isFile() &&
            signingStorePassword && signingAlias && signingKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingFilePath)
                storeType 'pkcs12'
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    testImplementation 'junit:junit:4.13.2'
}
