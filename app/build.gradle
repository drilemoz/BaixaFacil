plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.baixafacil'
    // Android 17 está publicado como platforms;android-37.0.
    // Selecionar explicitamente o nível secundário evita buscar android-37 (inexistente).
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }

    defaultConfig {
        applicationId 'br.com.baixafacil'
        minSdk 29
        targetSdk 34
        versionCode 58
        versionName '0.1.0-alpha.58'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // GeckoView 158 distribui bibliotecas nativas para ARM32, ARM64 e x86_64.
    // x86 (32 bits) foi descontinuado: NÃO publicar um APK sem libxul.so.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    // Usado somente quando os 4 Secrets estão disponíveis no GitHub Actions.
    // Nenhuma senha ou chave é gravada no repositório.
    def signingFilePath = System.getenv('KEYSTORE_FILE')
    def signingStorePassword = System.getenv('KEYSTORE_PASSWORD')
    def signingAlias = System.getenv('KEY_ALIAS')
    def signingKeyPassword = System.getenv('KEY_PASSWORD')
    def hasReleaseSigning = signingFilePath && file(signingFilePath).isFile() &&
            signingStorePassword && signingAlias && signingKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingFilePath)
                storeType 'pkcs12'
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    testImplementation 'junit:junit:4.13.2'
}
